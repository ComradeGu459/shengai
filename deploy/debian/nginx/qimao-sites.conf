# qimao-terms-cloud 两站静态托管模板（Debian 12 Nginx）。
# 仅替换 .example.invalid、证书路径和管理员测试门占位后启用。
# work 是员工站；admin 是管理员 ControlShell。员工站不提供服务器/容量/压测入口。
# API 仍由独立 qimao-backend.conf 的 api host 或本文件的同源 /api 反代提供。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/mime.types;

# ---------- HTTP：员工站 ----------
server {
    listen 80;
    listen [::]:80;
    server_name work.example.invalid;
    return 308 https://$host$request_uri;
}

# ---------- HTTP：管理员站（试用临时门同样生效） ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.invalid;

    satisfy all;
    # RFC 5737 TEST-NET 占位值；上线前必须替换成管理员办公出口 IPv4/32。
    allow 198.51.100.10/32;
    deny all;
    auth_basic "Temporary management test gate (not Access/JWT)";
    auth_basic_user_file /etc/nginx/.htpasswd-qimao-test;

    return 308 https://$host$request_uri;
}

# ---------- HTTPS：员工站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name work.example.invalid;

    ssl_certificate /etc/letsencrypt/live/REPLACE_COMPANY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_COMPANY_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /srv/qimao-terms-cloud/frontend;
    index index.html;
    default_type application/octet-stream;
    # API/health 优先反代；绝不把 Fastify 4xx/5xx 改成 index.html。
    location = /api {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/ {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location = /health {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }

    # source map 默认不公开；需要诊断时由管理员另行提供受控存储。
    location ~* \.map$ {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # BrowserRouter/history fallback 只作用于非 API 路径。
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS：管理员站（整站临时门） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.invalid;

    satisfy all;
    # 必须同时满足固定 IP 和 Basic Auth；这不是正式 Cloudflare Access/JWT。
    allow 198.51.100.10/32;
    deny all;
    auth_basic "Temporary management test gate (not Access/JWT)";
    auth_basic_user_file /etc/nginx/.htpasswd-qimao-test;

    ssl_certificate /etc/letsencrypt/live/REPLACE_COMPANY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_COMPANY_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /srv/qimao-terms-cloud/system-frontend;
    index index.html;
    default_type application/octet-stream;

    # 管理员站同样先反代 API/health，保持真实状态码、requestId 和 JSON 错误。
    location = /api {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/ {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location = /health {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ~* \.map$ {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
