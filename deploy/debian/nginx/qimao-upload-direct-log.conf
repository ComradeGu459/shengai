# 必须安装到 nginx 的 http 上下文（例如 /etc/nginx/conf.d/），再启用站点配置。
# 日志刻意不记录 URI、客户端 IP、Cookie、Authorization、Upload-Metadata 或文件名。
map $request_method $qimao_upload_direct_operation {
    default rejected;
    OPTIONS preflight;
    POST    create;
    HEAD    resume;
    PATCH   patch;
}

map $http_upload_offset $qimao_upload_direct_offset_request {
    default          "-";
    "~^[0-9]{1,13}$" $http_upload_offset;
}

limit_conn_zone $binary_remote_addr zone=qimao_upload_direct_per_ip:10m;

log_format qimao_upload_direct
    '$time_iso8601 request_id=$request_id op=$qimao_upload_direct_operation '
    'status=$status bytes_in=$request_length bytes_out=$body_bytes_sent '
    'request_time=$request_time upstream_status=$upstream_status '
    'upstream_time=$upstream_response_time '
    'upload_offset_request=$qimao_upload_direct_offset_request '
    'upload_offset_response=$sent_http_upload_offset';
