# upload.milaidi.online 的直连 TUS 数据面草案。
# Phase-B 前不得安装或启用。本文件按现有 TUS 路径草拟；BACK 的最终路径、认证头和
# Cookie SameSite 合同冻结后，必须先复核 CORS allow-list，再执行 nginx -t。

server {
    listen 18443 ssl http2;
    server_name upload.milaidi.online;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/upload.milaidi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upload.milaidi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QimaoUploadDirectTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 当前前端分片为 2 MiB；总文件大小由 TUS 会话控制，不由单个请求体限制。
    client_max_body_size 3m;
    client_body_timeout 5m;
    send_timeout 5m;
    keepalive_timeout 75s;

    # 仅限制同一来源的并发连接；不要对 PATCH 配置 limit_req 或总文件时限。
    limit_conn qimao_upload_direct_per_ip 4;
    access_log /var/log/nginx/qimao-upload-direct.access.log qimao_upload_direct;
    error_log /var/log/nginx/qimao-upload-direct.error.log warn;

    location = /api/uploads/tus {
        if ($http_origin != "https://milaidi.online") { return 403; }

        add_header Access-Control-Allow-Origin "https://milaidi.online" always;
        add_header Access-Control-Expose-Headers "Location,Tus-Resumable,Upload-Offset,Upload-Length,Upload-Metadata" always;
        add_header Vary "Origin" always;
        add_header X-Request-Id $request_id always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://milaidi.online" always;
            add_header Access-Control-Allow-Methods "OPTIONS,POST" always;
            add_header Access-Control-Allow-Headers "Tus-Resumable,Upload-Length,Upload-Metadata,Upload-Offset,Content-Type,x-qimao-upload-capability" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary "Origin" always;
            add_header X-Request-Id $request_id always;
            add_header Content-Length 0;
            return 204;
        }

        limit_except OPTIONS POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Qimao-Upload-Capability $http_x_qimao_upload_capability;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
    }

    location ~ "^/api/uploads/tus/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" {
        if ($http_origin != "https://milaidi.online") { return 403; }

        add_header Access-Control-Allow-Origin "https://milaidi.online" always;
        add_header Access-Control-Expose-Headers "Location,Tus-Resumable,Upload-Offset,Upload-Length,Upload-Metadata" always;
        add_header Vary "Origin" always;
        add_header X-Request-Id $request_id always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://milaidi.online" always;
            add_header Access-Control-Allow-Methods "OPTIONS,HEAD,PATCH" always;
            add_header Access-Control-Allow-Headers "Tus-Resumable,Upload-Length,Upload-Metadata,Upload-Offset,Content-Type,x-qimao-upload-capability" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary "Origin" always;
            add_header X-Request-Id $request_id always;
            add_header Content-Length 0;
            return 204;
        }

        limit_except OPTIONS HEAD PATCH { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Qimao-Upload-Capability $http_x_qimao_upload_capability;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
    }

    # 直连域名不承载页面、登录或普通 API；未知路径和额外 TUS 形态均拒绝。
    location / { return 404; }
}
