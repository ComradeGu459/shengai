# qimao-terms-cloud 一天公网测试配置。
# 仅允许规划指定的 18080/18081；不得改成 80/443，也不包含 TLS/Secret。

limit_req_zone $binary_remote_addr zone=qimao_public_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=qimao_public_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 0.0.0.0:18080;
    server_name _;

    root /srv/qimao-terms-cloud/frontend;
    index index.html;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    client_max_body_size 10m;
    limit_req zone=qimao_public_req burst=20 nodelay;
    limit_conn qimao_public_conn 20;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/uploads/tus {
        client_max_body_size 20m;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/local/uploads/ {
        client_max_body_size 80m;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/ {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location = /health {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ~* \.map$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
