# qimao-terms-cloud 无域名测试模式。
# 两站只监听 loopback，必须通过 SSH 隧道访问；不得作为公网发布配置。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 员工站：SSH 隧道目标 127.0.0.1:8080。
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/qimao-terms-cloud/frontend;
    index index.html;
    default_type application/octet-stream;
    server_tokens off;

    location = /api {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/uploads/tus {
        client_max_body_size 20m;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/local/uploads/ {
        client_max_body_size 80m;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ^~ /api/ {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location = /health {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/qimao-proxy-headers.conf;
    }
    location ~* \.map$ {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

# 管理员站：SSH 隧道目标 127.0.0.1:8081。
