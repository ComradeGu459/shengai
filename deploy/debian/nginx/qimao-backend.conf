# qimao-terms-cloud Debian 12 Nginx 模板。
# 仅替换 REPLACE_* 占位符后启用；不要把占位域名/证书当成已配置的生产值。
# 管理 API 的 IP + Basic Auth 是临时测试门，不是 Cloudflare Access/JWT。

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_BACKEND_HOST.example.invalid;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_BACKEND_HOST.example.invalid;

    # 必须由用户提供并由受信任的证书流程管理；仓库不保存证书或私钥。
    ssl_certificate /etc/letsencrypt/live/REPLACE_BACKEND_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_BACKEND_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;

    # 仅用于本机/受控监控探针；后端自身仍只监听 127.0.0.1:3001。
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Qimao-Employee-User "";
    }

    # 临时测试门：必须同时命中固定办公出口 IP 和 Basic Auth。
    # 该配置不是正式 Access/JWT；正式上线前必须替换为规划批准的身份边界。
    location ^~ /api/system-control/ {
        satisfy all;
        # RFC 5737 TEST-NET 占位值；上线前必须替换成明确的办公出口 IPv4/32。
        allow 198.51.100.10/32;
        deny all;
        auth_basic "Temporary management test gate (not Access/JWT)";
        auth_basic_user_file /etc/nginx/.htpasswd-qimao-test;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Qimao-Employee-User "";
        proxy_read_timeout 60s;
    }

    # 其他 API 只作受控测试转发；不要据此宣称员工站/管理员站已完成正式鉴权。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Qimao-Employee-User "";
        proxy_read_timeout 60s;
    }
}
