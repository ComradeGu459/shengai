# 直传 relay 入口的脱敏访问日志格式。严禁加入 URI、Cookie、Authorization、文件名或能力令牌。
log_format qimao_upload_relay_direct
    '$time_iso8601 request_id=$request_id status=$status '
    'bytes_in=$request_length bytes_out=$body_bytes_sent '
    'request_time=$request_time upstream_status=$upstream_status '
    'upstream_time=$upstream_response_time';
