# upload.milaidi.online 仅承载 multipart server_relay 的数据面。
# CORS 由 Fastify 的精确路由实现，避免 Nginx 与应用层重复或冲突地注入响应头。
server {
    listen 443 ssl http2;
    server_name upload.milaidi.online;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/upload.milaidi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upload.milaidi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # 当前 multipart 分片为 16 MiB；上限为单请求保护而非总文件上限。
    client_max_body_size 80m;
    client_body_timeout 15m;
    send_timeout 15m;
    keepalive_timeout 75s;

    access_log /var/log/nginx/qimao-upload-relay-direct.access.log qimao_upload_relay_direct;
    error_log /var/log/nginx/qimao-upload-relay-direct.error.log warn;

    # 仅允许 UUID 上传会话的正整数分片 PUT，以及浏览器预检 OPTIONS。
    location ~ "^/api/local/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/parts/[1-9][0-9]*$" {
        limit_except OPTIONS PUT { deny all; }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3001;
    }

    # 直连域名不承载页面、登录或其他 API。
    location / { return 404; }
}
